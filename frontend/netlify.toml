[build]
  command = "echo 'No build command needed'"

[dev]
  command = "npx serve"
  port = 3000
  targetPort = 3000
  autoLaunch = false

[[redirects]]
  from = "/src/api/*"
  to = "/403.html"
  status = 403
  force = true

[[redirects]]
  from = "/src/components/*"
  to = "/403.html"
  status = 403
  force = true

[[redirects]]
  from = "/src/pages/*"
  to = "/403.html"
  status = 403
  force = true

[[redirects]]
  from = "/src/middleware/*"
  to = "/403.html"
  status = 403
  force = true

[[redirects]]
  from = "/src/provider/*"
  to = "/403.html"
  status = 403
  force = true

[[redirects]]
  from = "/src/static/*"
  to = "/403.html"
  status = 403
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"

[context.production.environment]
  NETLIFY_DEV_HUD_ENABLED = "false"